set -g mouse on

# Close all minicom UART panes spawned by scripts/qemu-pty.sh in one shot.
# Default tmux prefix is C-b, so the binding is `C-b Q`. The confirm
# prompt prevents accidental triggers from inside a minicom pane (where
# C-b is otherwise just forwarded to the serial console).
bind Q confirm-before -p "Close all UART panes? (y/n) " \
    "run-shell 'pkill -x minicom'"
