# Scenario 01 / "Bao + Zephyr + UART" - minimal printk app.
#
# Explicitly disable PLIC: the cv32a6 SoC's Kconfig.defconfig sets
# `config PLIC default y` and `select RISCV_HAS_PLIC`, but our baovm board
# uses APLIC + IMSIC (no PLIC node in DT). Without this override, the
# PLIC driver tries to compile against a non-existent DT instance and
# build fails.
CONFIG_PLIC=n
